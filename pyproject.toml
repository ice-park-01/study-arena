[project]
name = "study-arena"
version = "0.1.0"
description = "강의자료로 문제를 풀고 친구와 공부 시간을 겨루는 학습 도우미"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "httpx>=0.27",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
